<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechStock C-Core | คลังสินค้าคอมพิวเตอร์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--side:#0d1326;--card:#121a30;--line:#1f2a44;--ink:#e8edf7;--mut:#8b97b3;--blue:#2f6bff;--grn:#10a37f;--red:#e5384f;--amb:#f5a524;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Prompt,"Noto Sans Thai",system-ui,sans-serif;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding-bottom:16px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-weight:600}
.brand small{display:block;color:var(--mut);font-size:.75rem}
nav button{all:unset;display:block;width:100%;padding:9px 12px;border-radius:8px;color:var(--mut);cursor:pointer}
nav button:hover{color:var(--ink)}nav button.on{background:var(--blue);color:#fff}
.sp{flex:1}
.go,.no{border:0;border-radius:8px;padding:10px;color:#fff;font:inherit;font-weight:500;cursor:pointer}
.go{background:var(--grn)}.no{background:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{padding:20px 28px 48px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:1.25rem;margin:0}h2{font-size:1rem;margin:0 0 12px}
.badge{border:1px solid var(--amb);color:var(--amb);padding:3px 12px;border-radius:99px;font-size:.85rem;margin-right:8px}
.badge.g{border-color:var(--grn);color:var(--grn)}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--mut)}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.two{grid-template-columns:3fr 2fr;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.stat small{color:var(--mut)}.stat b{display:block;font-size:1.6rem;line-height:1.3}
.stat.w b{color:var(--amb)}
.chart{height:200px;display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 39px,var(--line) 39px 40px)}
.bar{flex:1;border-radius:6px 6px 0 0;position:relative;min-height:3px}
.bar span{position:absolute;top:-20px;width:100%;text-align:center;font-size:.8rem;color:var(--mut)}
.lbls{display:flex;gap:16px;margin-top:6px}.lbls span{flex:1;text-align:center;font-size:.8rem;color:var(--mut)}
.alerts{display:grid;gap:8px;max-height:250px;overflow:auto}
.al{border:1px solid #5a4311;background:#1d1a14;border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px}
.al.out{border-color:#6b2230;background:#1f141a}
.al small{color:var(--mut);display:block}.al b.l{color:var(--amb)}.al.out b.l{color:var(--red)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:.85rem}tr:last-child td{border:0}
.tg{padding:1px 8px;border-radius:5px;font-size:.78rem;border:1px solid}
.tg.in,.tg.ok{color:#34d399;border-color:#14614a;background:#0f2a24}
.tg.out{color:#ff6b81;border-color:#7a2434;background:#2a1219}
.tg.low{color:var(--amb);border-color:#6b4d10;background:#2a2110}
.pos{color:#34d399}.neg{color:#ff6b81}
input,select{font:inherit;background:#0e1527;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar2 input{flex:1;min-width:110px}
.mini{padding:3px 9px;font-size:.8rem}
pre{background:#0a0f1d;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:.85rem}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(380px,92vw)}
dialog::backdrop{background:#000a}
dialog form{display:grid;gap:10px}dialog label{display:grid;gap:3px;color:var(--mut);font-size:.85rem}
.btns{display:flex;gap:8px;justify-content:flex-end}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:9}
.toast{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--amb);border-radius:8px;padding:10px 14px;max-width:320px;box-shadow:0 6px 20px #0008}
.toast.out{border-left-color:var(--red)}.toast.ok{border-left-color:var(--grn)}
@media(max-width:860px){body{grid-template-columns:1fr}aside{position:static;height:auto}.two{grid-template-columns:1fr}.sp{display:none}nav{display:flex;flex-wrap:wrap}}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo">T</div><div><b>TechStock C-Core</b><small>คลังสินค้าคอมพิวเตอร์</small></div></div>
  <nav id="nav"></nav>
  <div class="sp"></div>
  <button class="go" onclick="openMove('in')">นำเข้าสินค้า (Stock In)</button>
  <button class="no" onclick="openMove('out')">นำออกสินค้า (Stock Out)</button>
</aside>
<main>
  <header><h1 id="title"></h1><div><span class="badge" id="badge"></span><button class="ghost" onclick="resetData()">รีเซ็ตข้อมูลตัวอย่าง</button></div></header>
  <div id="view"></div>
</main>
<dialog id="dlg"><form id="mf"><h2 id="mt"></h2>
  <label>สินค้า<select id="ms"></select></label>
  <label>จำนวน<input id="mq" type="number" min="1" value="1" required></label>
  <label>หมายเหตุ<input id="mn" maxlength="80" placeholder="เช่น รับของจากซัพพลายเออร์"></label>
  <div class="btns"><button type="button" class="ghost" onclick="dlg.close()">ยกเลิก</button><button class="go" id="mb">ยืนยัน</button></div>
</form></dialog>
<div id="toasts" aria-live="assertive"></div>
<script>
const $=s=>document.querySelector(s), KEY='techstock-v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#3b6fd4','#8b4fd0','#16a37a','#c98a14','#5560c9','#d6405a','#2aa3b8','#b8579a'];
const SEED=()=>{const n=Date.now();return{items:[
 {sku:'CPU-INT-14900K',name:'Intel Core i9-14900K',cat:'CPU',qty:8,min:3,price:22900},
 {sku:'CPU-AMD-7800X3D',name:'AMD Ryzen 7 7800X3D',cat:'CPU',qty:3,min:5,price:14500},
 {sku:'GPU-NV-4090',name:'NVIDIA GeForce RTX 4090 24GB',cat:'GPU',qty:2,min:4,price:62900},
 {sku:'GPU-NV-4070S',name:'NVIDIA GeForce RTX 4070 Super',cat:'GPU',qty:15,min:4,price:21900},
 {sku:'RAM-COR-32D5',name:'Corsair Vengeance DDR5 32GB',cat:'RAM',qty:25,min:8,price:4200},
 {sku:'SSD-SAM-990P',name:'Samsung 990 PRO NVMe 2TB',cat:'SSD/HDD',qty:4,min:6,price:7900},
 {sku:'MB-ASU-Z790E',name:'ASUS ROG Strix Z790-E',cat:'Mainboard',qty:8,min:3,price:18900},
 {sku:'PSU-COR-RM1000',name:'Corsair RM1000x 1000W',cat:'PSU',qty:1,min:2,price:7500}],
 log:[{t:n-864e5,type:'in',sku:'CPU-INT-14900K',name:'Intel Core i9-14900K',qty:5,note:'รับสินค้าจากซัพพลายเออร์ Lot #A4'},
      {t:n-36e5,type:'out',sku:'GPU-NV-4090',name:'NVIDIA GeForce RTX 4090 24GB',qty:1,note:'เบิกประกอบเครื่องคอมชุดประกอบ'}]}};
let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||SEED()}catch{return SEED()}})(), view='dash', mtype='in';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const st=i=>i.qty<=0?'out':i.qty<=i.min?'low':'ok', LB={ok:'ปกติ',low:'ใกล้หมด',out:'หมด'};
const baht=n=>'฿'+n.toLocaleString('th-TH'), when=t=>new Date(t).toLocaleString('th-TH');
const alerts=()=>S.items.filter(i=>st(i)!=='ok');

function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),6000)}
function move(sku,type,q,note){
  const it=S.items.find(i=>i.sku===sku);
  if(!it||!(q>0)){toast('ข้อมูลไม่ถูกต้อง','out');return false}
  if(type==='out'&&q>it.qty){toast('สต็อกไม่พอ: '+it.name+' เหลือ '+it.qty+' ชิ้น','out');return false}
  it.qty+=type==='in'?q:-q;
  S.log.unshift({t:Date.now(),type,sku,name:it.name,qty:q,note:note||''});S.log=S.log.slice(0,200);save();
  const s=st(it);
  if(type==='out'&&s!=='ok')toast((s==='out'?'สินค้าหมด: ':'สินค้าใกล้หมด: ')+it.name+' (เหลือ '+it.qty+')',s);
  else toast((type==='in'?'นำเข้า ':'นำออก ')+it.name+' x'+q,'ok');
  render();return true;
}
function openMove(type,sku){
  mtype=type;$('#mt').textContent=type==='in'?'นำเข้าสินค้า':'นำออกสินค้า';
  $('#mb').className=type==='in'?'go':'no';
  $('#ms').innerHTML=S.items.map(i=>`<option value="${esc(i.sku)}">${esc(i.name)} (เหลือ ${i.qty})</option>`).join('');
  if(sku)$('#ms').value=sku;$('#mq').value=1;$('#mn').value='';$('#dlg').showModal();
}
$('#mf').onsubmit=e=>{e.preventDefault();if(move($('#ms').value,mtype,+$('#mq').value,$('#mn').value))$('#dlg').close()};
function addItem(e){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),sku=f.sku.trim();
  if(S.items.some(i=>i.sku===sku)){toast('รหัส SKU นี้มีอยู่แล้ว','out');return}
  S.items.push({sku,name:f.name.trim(),cat:f.cat.trim()||'อื่นๆ',qty:+f.qty||0,min:+f.min||0,price:+f.price||0});
  save();e.target.reset();toast('เพิ่มสินค้าแล้ว','ok');render();
}
function del(sku){if(confirm('ลบสินค้านี้ออกจากรายการ?')){S.items=S.items.filter(i=>i.sku!==sku);save();render()}}
function resetData(){if(confirm('รีเซ็ตเป็นข้อมูลตัวอย่าง? ข้อมูลที่เพิ่มเองจะหายทั้งหมด')){S=SEED();save();render()}}
function logRows(l){return l.map(m=>`<tr><td>${when(m.t)}</td><td><span class="tg ${m.type}">${m.type==='in'?'+ นำเข้า':'- นำออก'}</span></td><td><b>${esc(m.name)}</b></td><td class="${m.type==='in'?'pos':'neg'}">${m.type==='in'?'+':'-'}${m.qty}</td><td>${esc(m.note)}</td></tr>`).join('')||'<tr><td colspan="5">ยังไม่มีประวัติ</td></tr>'}
const LOGHEAD='<thead><tr><th>เวลา</th><th>ประเภท</th><th>รายการสินค้า</th><th>จำนวน</th><th>หมายเหตุ</th></tr></thead>';

const V={
dash(){
  const cats=[...new Set(S.items.map(i=>i.cat))],tot=cats.map(c=>S.items.filter(i=>i.cat===c).reduce((a,i)=>a+i.qty,0)),mx=Math.max(1,...tot);
  const al=alerts(),pcs=S.items.reduce((a,i)=>a+i.qty,0),val=S.items.reduce((a,i)=>a+i.qty*i.price,0);
  return `<div class="grid stats">
   <div class="card stat"><small>รวมชนิดสินค้า</small><b>${S.items.length}</b><small>รายการสินค้าต่างชนิด</small></div>
   <div class="card stat"><small>รวมจำนวนชิ้นในคลัง</small><b>${pcs}</b><small>ชิ้น</small></div>
   <div class="card stat ${al.length?'w':''}"><small>สินค้าสต็อกใกล้หมด</small><b>${al.length}</b><small>ต่ำกว่าเกณฑ์แจ้งเตือนหรือหมด</small></div>
   <div class="card stat"><small>มูลค่ารวมในคลัง</small><b>${baht(val)}</b><small>ประเมินจากราคาสินค้า</small></div></div>
  <div class="grid two">
   <div class="card"><h2>สัดส่วนจำนวนสินค้าแยกตามประเภท</h2>
    <div class="chart" style="padding-top:24px">${tot.map((v,k)=>`<div class="bar" style="height:${v/mx*100}%;background:${COL[k%COL.length]}"><span>${v}</span></div>`).join('')}</div>
    <div class="lbls">${cats.map(c=>`<span>${esc(c)}</span>`).join('')}</div></div>
   <div class="card"><h2>การแจ้งเตือนด่วน (Low Stock Alert)</h2><div class="alerts">${al.map(i=>`<div class="al ${st(i)}"><div><b>${esc(i.name)}</b><small>SKU: ${esc(i.sku)}</small></div><div style="text-align:right"><b class="l">${i.qty?'เหลือ '+i.qty+' ชิ้น':'หมดสต็อก'}</b><small>เกณฑ์: ${i.min}</small></div></div>`).join('')||'<p style="color:var(--mut)">สต็อกทุกรายการอยู่ในเกณฑ์ปกติ</p>'}</div></div></div>
  <div class="card"><div style="display:flex;justify-content:space-between"><h2>กิจกรรมล่าสุด (Recent Movements)</h2><button class="ghost mini" onclick="go('hist')">ดูทั้งหมด</button></div>
   <div class="wrap"><table>${LOGHEAD}<tbody>${logRows(S.log.slice(0,5))}</tbody></table></div></div>`},
inv(){
  const k=($('#q')?.value||'').toLowerCase();
  const rows=S.items.filter(i=>(i.name+i.sku+i.cat).toLowerCase().includes(k));
  return `<div class="card" style="margin-bottom:16px"><h2>เพิ่มสินค้าใหม่</h2>
   <form class="bar2" onsubmit="addItem(event)"><input name="sku" placeholder="SKU เช่น RAM-KNG-16" required maxlength="24" pattern="[^,\\s]+">
   <input name="name" placeholder="ชื่อสินค้า" required maxlength="60"><input name="cat" placeholder="ประเภท" maxlength="20">
   <input name="qty" type="number" min="0" placeholder="จำนวน" style="max-width:100px"><input name="min" type="number" min="0" placeholder="เกณฑ์เตือน" style="max-width:110px">
   <input name="price" type="number" min="0" placeholder="ราคา (บาท)" style="max-width:130px"><button class="go">เพิ่มสินค้า</button></form></div>
  <div class="card"><div class="bar2"><input id="q" placeholder="ค้นหาชื่อ, SKU หรือประเภท" value="${esc(k)}" oninput="render(true)"></div>
  <div class="wrap"><table><thead><tr><th>สินค้า</th><th>ประเภท</th><th>คงเหลือ</th><th>เกณฑ์</th><th>ราคา</th><th>สถานะ</th><th></th></tr></thead><tbody>
  ${rows.map(i=>`<tr><td><b>${esc(i.name)}</b><br><small style="color:var(--mut)">${esc(i.sku)}</small></td><td>${esc(i.cat)}</td><td>${i.qty}</td><td>${i.min}</td><td>${baht(i.price)}</td><td><span class="tg ${st(i)}">${LB[st(i)]}</span></td>
  <td style="white-space:nowrap"><button class="ghost mini" onclick="openMove('in','${esc(i.sku)}')">นำเข้า</button> <button class="ghost mini" onclick="openMove('out','${esc(i.sku)}')">นำออก</button> <button class="ghost mini" onclick="del('${esc(i.sku)}')">ลบ</button></td></tr>`).join('')||'<tr><td colspan="7">ไม่พบสินค้า</td></tr>'}</tbody></table></div></div>`},
hist(){return `<div class="card"><div class="wrap"><table>${LOGHEAD}<tbody>${logRows(S.log)}</tbody></table></div></div>`},
code(){return `<div class="card"><h2>ตรรกะสต็อกเดียวกัน เขียนด้วยภาษา C</h2>
<p style="color:var(--mut)">หน้านี้คำนวณด้วย JavaScript ในเบราว์เซอร์ (GitHub Pages รันโปรแกรม C ไม่ได้) ส่วนโค้ดด้านล่างคือตรรกะเดียวกันในภาษา C ซึ่งนำไปคอมไพล์เป็น WebAssembly ต่อได้</p>
<pre>typedef struct { char sku[24]; int qty, min; } Item;

const char *status(const Item *i) {
    return i-&gt;qty &lt;= 0 ? "out" : i-&gt;qty &lt;= i-&gt;min ? "low" : "ok";
}
int stock_in(Item *i, int q)  { if (q &lt;= 0) return 0; i-&gt;qty += q; return 1; }
int stock_out(Item *i, int q) { if (q &lt;= 0 || q &gt; i-&gt;qty) return 0; i-&gt;qty -= q; return 1; }</pre>
<h2>เผยแพร่บน GitHub Pages</h2>
<pre>1. อัปโหลดไฟล์ index.html ไปที่รากของ repo
2. Settings &rarr; Pages &rarr; Deploy from a branch &rarr; main / (root) &rarr; Save
3. รอ 1-2 นาที แล้วเปิด https://ชื่อผู้ใช้.github.io/ชื่อrepo/</pre></div>`}
};
const TITLES={dash:'แดชบอร์ดสรุปภาพรวม',inv:'คลังสินค้าทั้งหมด',hist:'ประวัติการเข้า-ออก',code:'โค้ด C & GitHub Deploy'};
function go(v){view=v;render()}
function render(keep){
  const q=$('#q'),pos=q?q.selectionStart:0;
  $('#nav').innerHTML=Object.keys(TITLES).map(k=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${TITLES[k]}</button>`).join('');
  $('#title').textContent=TITLES[view];
  const n=alerts().length;$('#badge').textContent=n?`มีสินค้าเตือนภัย ${n} รายการ`:'สต็อกปกติ';$('#badge').className='badge'+(n?'':' g');
  $('#view').innerHTML=V[view]();
  if(keep&&$('#q')){$('#q').focus();$('#q').setSelectionRange(pos,pos)}
}
render();
</script>
</body>
</html>
